# Builds the Flatpak bundle for a tagged release and attaches it to the
# GitHub release for that tag. install.sh downloads exactly this file:
#   https://github.com/opus-editor/opus/releases/latest/download/Opus.flatpak
# so the asset name must stay `Opus.flatpak`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      # Same runtime branch as build/'s manifest; bump both together.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build/io.github.opus_editor.Opus.json
          bundle: Opus.flatpak
          # Keyed on the manifest, not the commit: the libpeas module is
          # rebuilt only when the manifest changes, Opus itself always.
          cache-key: flatpak-builder-${{ hashFiles('build/*.json') }}
          upload-artifact: false

      - uses: softprops/action-gh-release@v2
        with:
          files: Opus.flatpak
          generate_release_notes: true
